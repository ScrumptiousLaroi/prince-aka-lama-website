# Publish the site to GitHub Pages on every push to main.
#
# Pages only serves files, so what goes up is public/ as it is, plus three.js
# copied out of node_modules (the Express server serves it from there). The
# media manifest is the committed public/data/*.json from `npm run static`, and
# every image and film in it is on Cloudinary — media/ never leaves the laptop.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --omit=dev

      - name: Assemble site
        run: |
          test -f public/data/media.json || { echo "public/data/media.json missing — run npm run static and commit it"; exit 1; }
          test -f public/data/projects.json || { echo "public/data/projects.json missing — run npm run static and commit it"; exit 1; }
          mkdir -p _site
          cp -R public/. _site/
          mkdir -p _site/vendor/three
          cp node_modules/three/build/three.module.min.js node_modules/three/build/three.core.min.js _site/vendor/three/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
